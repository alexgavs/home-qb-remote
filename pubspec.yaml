name: home_qb_remote
description: "An open-source qBittorrent remote client without ads or analytics."
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ^3.13.5

dependencies:
  xml: ^7.1.0
  crypto: ^3.0.7
  app_links: ^7.2.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  local_auth_darwin: ^2.0.5
  network_info_plus: ^8.2.2
  # 13.x pulls Android SDK 37, beyond this Flutter/AGP toolchain's SDK metadata support.
  permission_handler: 12.0.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
